&lt;script&gt;
  (() =&gt; {
    const root = document.getElementById(&quot;eu-inflatiekaart&quot;);
    const slider = root.querySelector(&quot;#kaart-jaar&quot;);
    const output = root.querySelector(&quot;#kaart-jaartal&quot;);
    const average = root.querySelector(&quot;#kaart-eu-gemiddelde&quot;);
    const marks = root.querySelectorAll(&quot;[data-land]&quot;);
    const { names, values } = JSON.parse(root.querySelector(&quot;[data-inflatie]&quot;).textContent);
    const thresholds = [3, 5, 10, 15];
    const formatter = new Intl.NumberFormat(&quot;nl-BE&quot;, { minimumFractionDigits: 1, maximumFractionDigits: 1 });
    const percent = (value) =&gt; formatter.format(value) + &quot;%&quot;;

    function render() {
      const year = slider.value;
      output.value = year;
      average.textContent = &quot;EU-gemiddelde · &quot; + percent(values.EU27_2020[year]);
      for (const mark of marks) {
        const code = mark.dataset.land;
        const value = values[code][year];
        const level = thresholds.filter((threshold) =&gt; value &gt;= threshold).length;
        const label = names[code] + &quot; · &quot; + percent(value);
        mark.setAttribute(&quot;class&quot;, &quot;land klasse-&quot; + level);
        mark.setAttribute(&quot;data-tooltip&quot;, label);
        mark.setAttribute(&quot;aria-label&quot;, label);
      }
    }

    function restore(state) {
      const year = state?.modelContent?.jaar;
      if (Number.isInteger(year) &amp;&amp; year &gt;= 2022 &amp;&amp; year &lt;= 2025) {
        slider.value = String(year);
      }
    }

    restore(window.openai?.widgetState);
    render();
    slider.addEventListener(&quot;input&quot;, render);
    slider.addEventListener(&quot;change&quot;, () =&gt; {
      window.openai?.setWidgetState?.({ modelContent: { jaar: slider.valueAsNumber } }).catch(() =&gt; {});
    });
    window.addEventListener(&quot;openai:set_globals&quot;, (event) =&gt; {
      restore(event.detail?.globals?.widgetState);
      render();
    });
  })();
&lt;/script&gt;
