    &lt;div class=&quot;source-notes text-small&quot;&gt;
      &lt;p&gt;De vraagtotalen tellen unieke gepubliceerde schriftelijke vraag-ID’s uit de huidige legislatuur. Meerdere documenten bij dezelfde vraag tellen één keer. Recent ingediende vragen kunnen nog ontbreken. De lijst toont maximaal vijf recent gepubliceerde vragen per lid. Via de titel lees je de volledige vraag en het antwoord. De datum in de lijst is de indieningsdatum, indien beschikbaar.&lt;/p&gt;
      &lt;p&gt;De fractiegrafiek groepeert de 124 huidige leden volgens hun huidige fractie. Ook vragen uit een eerdere fractieperiode van hetzelfde lid tellen daarbij mee. Voormalige leden vallen buiten deze vergelijking. Het gemiddelde per lid deelt door het huidige aantal leden.&lt;/p&gt;
      &lt;p&gt;Plenaire aanwezigheid deelt de aanwezige registraties door aanwezig, afwezig en verontschuldigd samen. Voor fracties worden deze aantallen eerst opgeteld. Commissieaanwezigheden zijn registraties per commissie en rol en kunnen dezelfde zitting meerdere keren tellen. Beide tellers staan los van het aantal vragen.&lt;/p&gt;

      &lt;p&gt;&lt;a href=&quot;https://ws.vlpar.be/e/opendata/swagger-ui/index.html&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Officiële open data&lt;/a&gt; · &lt;a href=&quot;https://www.vlaamsparlement.be/nl/volksvertegenwoordigers/wie-zit-waar-het-vlaams-parlement&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Officieel zetelplan&lt;/a&gt;&lt;/p&gt;

&lt;script&gt;
  (() =&gt; {
    const root = document.getElementById(&#x27;parlement-verkenner&#x27;);
    const { people, paths } = JSON.parse(root.querySelector(&#x27;#pv-data&#x27;).textContent);
    const byId = new Map(people.map(person =&gt; [String(person.id), person]));
    const party = root.querySelector(&#x27;#pv-party&#x27;);
    const search = root.querySelector(&#x27;#pv-search&#x27;);
    const picker = root.querySelector(&#x27;#pv-person&#x27;);
    const metric = root.querySelector(&#x27;#pv-metric&#x27;);
    const integer = new Intl.NumberFormat(&#x27;nl-BE&#x27;);
    const percentage = new Intl.NumberFormat(&#x27;nl-BE&#x27;, { style: &#x27;percent&#x27;, maximumFractionDigits: 1 });
    const normalize = value =&gt; value.normalize(&#x27;NFD&#x27;).replace(/[\u0300-\u036f]/g, &#x27;&#x27;).toLocaleLowerCase(&#x27;nl-BE&#x27;);
    const svgNamespace = &#x27;http://www.w3.org/2000/svg&#x27;;
    let selectedId = &#x27;4443&#x27;;
    const savedStates = new Set();

    for (const faction of [...new Set(people.map(person =&gt; person.party))].sort()) {
      party.add(new Option(faction, faction));
    }
    const seatLinks = new Map();
    const bySeat = new Map(people.map(person =&gt; [String(person.seat), person]));
    const seatGroup = root.querySelector(&#x27;#pv-seats&#x27;);
    for (const [seat, shape] of Object.entries(paths)) {
      const person = bySeat.get(seat);
      const path = document.createElementNS(svgNamespace, &#x27;path&#x27;);
      path.setAttribute(&#x27;d&#x27;, shape);
      path.setAttribute(&#x27;class&#x27;, &#x27;seat-shape&#x27;);
      if (!person) {
        path.setAttribute(&#x27;aria-hidden&#x27;, &#x27;true&#x27;);
        seatGroup.append(path);
        continue;
      }
      const link = document.createElementNS(svgNamespace, &#x27;a&#x27;);
      link.setAttribute(&#x27;href&#x27;, &#x27;#pv-selected&#x27;);
      link.setAttribute(&#x27;class&#x27;, &#x27;seat-link cursor-interaction&#x27;);
      link.dataset.person = String(person.id);
      link.append(path);
      link.addEventListener(&#x27;click&#x27;, event =&gt; {
        event.preventDefault();
        selectedId = String(person.id);
        if (party.value &amp;&amp; party.value !== person.party) party.value = &#x27;&#x27;;
        search.value = &#x27;&#x27;;
        update(true);
      });
      seatLinks.set(String(person.id), link);
      seatGroup.append(link);
    }

    function memberValue(person) {
      if (metric.value === &#x27;plenary&#x27;) {
        const total = person.present + person.absent + person.excused;
        return total ? person.present / total : null;
      }
      return metric.value === &#x27;committee&#x27; ? person.committee : person.questions;
    }

    function matchingPeople() {
      return people.filter(person =&gt; (!party.value || person.party === party.value)
        &amp;&amp; normalize(person.name).includes(normalize(search.value.trim())));
    }

    function save() {
      const state = { modelContent: {
        verkenner: &#x27;vlaams-parlement&#x27;,
        parlementslid: selectedId, fractie: party.value, maatstaf: metric.value,
      }, privateContent: { search: search.value } };
      savedStates.add(JSON.stringify(state));
      window.openai?.setWidgetState?.(state).catch(() =&gt; {});
    }

    function restore(state) {
      const content = state?.modelContent;
      if (content?.verkenner !== &#x27;vlaams-parlement&#x27;) return;
      if (byId.has(String(content?.parlementslid))) selectedId = String(content.parlementslid);
      if ([...party.options].some(option =&gt; option.value === content?.fractie)) party.value = content.fractie;
      if ([...metric.options].some(option =&gt; option.value === content?.maatstaf)) metric.value = content.maatstaf;
      if (typeof state?.privateContent?.search === &#x27;string&#x27;) search.value = state.privateContent.search;
    }

    function update(remember = false) {
      const matches = matchingPeople();
      if (!matches.some(person =&gt; String(person.id) === selectedId) &amp;&amp; matches.length) {
        selectedId = String(matches[0].id);
      }
      picker.replaceChildren(...matches.slice().sort((a, b) =&gt; a.name.localeCompare(b.name, &#x27;nl-BE&#x27;))
        .map(person =&gt; new Option(person.name, String(person.id))));
      picker.value = selectedId;
      picker.disabled = !matches.length;
      root.querySelector(&#x27;#pv-no-match&#x27;).hidden = matches.length &gt; 0;
      const person = byId.get(selectedId);
      const active = new Set(matches.map(match =&gt; String(match.id)));
      const maxValue = Math.max(...people.map(member =&gt; memberValue(member) ?? 0), 1);
      for (const member of people) {
        const link = seatLinks.get(String(member.id));
        const value = memberValue(member);
        const label = member.name + &#x27; · &#x27; + member.party + &#x27; · &#x27; + (value === null ? &#x27;geen gegevens&#x27; : metric.value === &#x27;plenary&#x27; ? percentage.format(value) : integer.format(value));
        link.style.setProperty(&#x27;--intensity&#x27;, (15 + 85 * Math.sqrt((value ?? 0) / maxValue)) + &#x27;%&#x27;);
        link.setAttribute(&#x27;aria-current&#x27;, String(String(member.id) === selectedId));
        link.setAttribute(&#x27;aria-label&#x27;, label);
        link.setAttribute(&#x27;data-tooltip&#x27;, label);
        link.dataset.muted = String(!active.has(String(member.id)));
      }
      root.querySelector(&#x27;#pv-map-unit&#x27;).textContent = metric.value === &#x27;plenary&#x27;
        ? &#x27;Zetelkleuren tonen het aandeel plenaire registraties als aanwezig.&#x27;
        : metric.value === &#x27;committee&#x27; ? &#x27;Zetelkleuren tonen de commissieaanwezigheden van elk lid.&#x27;
        : &#x27;Zetelkleuren tonen het aantal gepubliceerde schriftelijke vragen van elk lid.&#x27;;
      root.querySelector(&#x27;.facts&#x27;).hidden = !matches.length;
      root.querySelector(&#x27;#pv-person-info&#x27;).hidden = !matches.length;
      root.querySelector(&#x27;#pv-question-section&#x27;).hidden = !matches.length;
      if (!matches.length) {
        root.querySelector(&#x27;#pv-name&#x27;).textContent = &#x27;Geen lid gevonden&#x27;;
        root.querySelector(&#x27;#pv-table-body&#x27;).replaceChildren();
        root.querySelector(&#x27;#pv-table-caption&#x27;).textContent = &#x27;Leden en cijfers (0)&#x27;;
        root.dispatchEvent(new CustomEvent(&#x27;pv:metric&#x27;, { detail: metric.value }));
        if (remember) save();
        return;
      }
      root.querySelector(&#x27;#pv-name&#x27;).textContent = person.name;
      root.querySelector(&#x27;#pv-person-info&#x27;).textContent = person.party + &#x27; · &#x27; + person.region + &#x27; · Zetel &#x27; + person.seat;
      root.querySelector(&#x27;#pv-questions&#x27;).textContent = integer.format(person.questions);
      const total = person.present + person.absent + person.excused;
      root.querySelector(&#x27;#pv-plenary&#x27;).textContent = integer.format(person.present) + &#x27; / &#x27; + integer.format(total) + (total ? &#x27; (&#x27; + percentage.format(person.present / total) + &#x27;)&#x27; : &#x27;&#x27;);
      root.querySelector(&#x27;#pv-committee&#x27;).textContent = integer.format(person.committee) + &#x27; registraties&#x27;;
      root.querySelector(&#x27;#pv-all-questions&#x27;).href = person.allQuestions;
      root.querySelector(&#x27;#pv-profile&#x27;).href = person.profile;
      const list = root.querySelector(&#x27;#pv-question-list&#x27;);
      list.replaceChildren();
      for (const question of person.recent) {
        const item = document.createElement(&#x27;li&#x27;);
        const link = document.createElement(&#x27;a&#x27;);
        link.href = question.text;
        link.target = &#x27;_blank&#x27;;
        link.rel = &#x27;noopener noreferrer&#x27;;
        link.textContent = question.title;
        const meta = document.createElement(&#x27;span&#x27;);
        meta.className = &#x27;question-meta text-small&#x27;;
        const submitted = question.date ? question.date.split(&#x27;-&#x27;).reverse().join(&#x27;-&#x27;) : &#x27;datum onbekend&#x27;;
        meta.textContent = &#x27;Ingediend &#x27; + submitted + &#x27; · &#x27; + question.minister + (question.theme ? &#x27; · &#x27; + question.theme : &#x27;&#x27;);
        item.append(link, meta);
        list.append(item);
      }
      if (!person.recent.length) {
        const item = document.createElement(&#x27;li&#x27;);
        item.textContent = &#x27;Geen gepubliceerde schriftelijke vragen in deze legislatuur.&#x27;;
        list.append(item);
      }
      const table = root.querySelector(&#x27;#pv-table-body&#x27;);
      table.replaceChildren();
      const ordered = matches.slice().sort((a, b) =&gt; (memberValue(b) ?? -1) - (memberValue(a) ?? -1) || a.name.localeCompare(b.name));
      for (const member of ordered) {
        const row = document.createElement(&#x27;tr&#x27;);
        const cell = document.createElement(&#x27;td&#x27;);
        const button = document.createElement(&#x27;button&#x27;);
        button.type = &#x27;button&#x27;;
        button.className = &#x27;btn btn-ghost&#x27;;
        button.textContent = member.name;
        button.addEventListener(&#x27;click&#x27;, () =&gt; { selectedId = String(member.id); update(true); });
        cell.append(button);
        row.append(cell);
        const base = member.present + member.absent + member.excused;
        for (const [index, text] of [member.party, integer.format(member.questions), member.present + &#x27;/&#x27; + base, integer.format(member.committee)].entries()) {
          const td = document.createElement(&#x27;td&#x27;);
          td.textContent = text;
          if (index &gt; 0) td.className = &#x27;text-end tabular-nums&#x27;;
          row.append(td);
        }
        table.append(row);
      }
      root.querySelector(&#x27;#pv-table-caption&#x27;).textContent = &#x27;Leden en cijfers (&#x27; + matches.length + &#x27;) · gesorteerd op gekozen maatstaf&#x27;;
      root.dispatchEvent(new CustomEvent(&#x27;pv:metric&#x27;, { detail: metric.value }));
      if (remember) save();
    }
    party.addEventListener(&#x27;change&#x27;, () =&gt; update(true));
    search.addEventListener(&#x27;input&#x27;, () =&gt; update(true));
    picker.addEventListener(&#x27;change&#x27;, () =&gt; { selectedId = picker.value; update(true); });
    metric.addEventListener(&#x27;change&#x27;, () =&gt; update(true));
    window.addEventListener(&#x27;openai:set_globals&#x27;, event =&gt; {
      const state = event.detail?.globals?.widgetState;
      if (state &amp;&amp; !savedStates.has(JSON.stringify(state))) { restore(state); update(); }
    });
    restore(window.openai?.widgetState);
    update();
  })();

&lt;script type=&quot;module&quot;&gt;
  import { mountChart } from &#x27;https://persistent.oaistatic.com/plugins/visualize/charts/1.8.1/element.js&#x27;;
  const root = document.getElementById(&#x27;parlement-verkenner&#x27;);

          throw new TypeError("Widget state must contain finite numbers");
        }
        return value;
      },
    );
    if (new TextEncoder().encode(canonicalState).length > 16 * 1024) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    return storedState;
  };
  let storage = null;
  let state = null;
  try {
    const localStorage = globalThis.localStorage;
    const probeKey = `${storageKey}:probe`;
    localStorage.setItem(probeKey, "1");
    localStorage.removeItem(probeKey);
    storage = localStorage;
    const savedState = storage.getItem(storageKey);
    if (savedState != null) {
      try {
        state = parseState(savedState);
      } catch {
        // Invalid saved state does not disable future writes.
      }
    }
  } catch {
    storage = null;
  }
  const persistSize = () => {
    globalThis.clearTimeout(sizeWriteTimeout);
    if (pendingSize == null) {
      return;
    }
    try {
      storage?.setItem(sizeStorageKey, pendingSize);
    } catch {
      // A denied or full cache must not affect the visualization.
    }
    pendingSize = null;
  };
  if (isShare) {
    globalThis.addEventListener("pagehide", persistSize);
  }
  const initialGlobals = {
    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height !== "number" ||
        !Number.isFinite(height) ||
        height < 0
      ) {
        return;
      }
      if (height <= 10_000) {
        const width = isShare && storage != null ? frame.clientWidth : null;
        frame.style.height = Math.ceil(height) + "px";
        if (isShare && storage != null) {
          const size = JSON.stringify({
            fingerprint: sizeFingerprint,
            width,
            viewportHeight: globalThis.innerHeight,
            dark: globalThis.matchMedia("(prefers-color-scheme: dark)").matches,
            scale: globalThis.devicePixelRatio,
            height: Math.ceil(height),
          });
          if (size !== lastSize) {
            lastSize = size;
            pendingSize = size;
            globalThis.clearTimeout(sizeWriteTimeout);
            sizeWriteTimeout = globalThis.setTimeout(persistSize, 100);
          }
        }
      }
      if (isShare) {
        // Keep unusually tall content accessible without accepting an unbounded height.
        if (height > 10_000 && Number.parseFloat(frame.style.height) === 0) {
          frame.style.removeProperty("height");
        }
        frame.scrolling = height > 10_000 ? "auto" : "no";
        document.documentElement.classList.add("visualization-share-ready");
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!isShare && (!Number.isFinite(height) || height <= viewportHeight)) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  const frameHtml = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  if (isShare && storage != null) {
    // Fingerprint the rendered document, including restored widget state, without
    // storing its content. This is a layout cache, not a security identity.
    let hash = 5381;
    for (let index = 0; index < frameHtml.length; index += 1) {
      hash = (hash * 33 + frameHtml.charCodeAt(index)) % 4_294_967_296;
    }
    sizeFingerprint = hash.toString(36);
    try {
      const size = JSON.parse(storage.getItem(sizeStorageKey) ?? "null");
      if (
        size?.fingerprint === sizeFingerprint &&
        size.width === frame.clientWidth &&
        size.viewportHeight === globalThis.innerHeight &&
        size.dark ===
          globalThis.matchMedia("(prefers-color-scheme: dark)").matches &&
        size.scale === globalThis.devicePixelRatio &&
        typeof size.height === "number" &&
        Number.isFinite(size.height) &&
        size.height >= 0 &&
        size.height <= 10_000
      ) {
        frame.style.height = size.height + "px";
      }
    } catch {
      // Ignore missing or invalid cache entries and measure the live frame.
    }
  }
  frame.srcdoc = frameHtml;
  delete frame.dataset.srcdoc;
})();
</script>
